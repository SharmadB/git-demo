name: My First Action

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from GitHub Actions!"

      - name: Show files
        run: ls -lname: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show files
        run: ls -la

      - name: Run test
        run: echo "Running tests..."

      - name: Success
        run: echo "CI Pipeline completed successfully!"
